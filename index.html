<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Questify</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            /* Clean Dark Theme Palette */
            --bg-base: #0a0a0c;
            --bg-surface: rgba(20, 20, 25, 0.85);
            --theme-primary: #00f3ff;
            --theme-secondary: #bc13fe;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-yellow: #fcee0a;
            --accent-red: #ff3366;
        }

        /* Alternate Themes */
        body.theme-matrix {
            --theme-primary: #00ff41;
            --theme-secondary: #008f11;
        }
        body.theme-crimson {
            --theme-primary: #ff003c;
            --theme-secondary: #8b0000;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; z-index: -1; width: 100vw; height: 100vh;
        }

        .glass-panel {
            background: var(--bg-surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* Animated Interactive Buttons */
        .btn-interact {
            transition: all 0.2s ease;
            min-height: 48px; /* Touch-friendly size */
            min-width: 48px;
        }
        .btn-interact:hover {
            transform: translateY(-2px);
        }
        .btn-interact:active {
            transform: scale(0.95);
        }

        .xp-bar-bg {
            background: #1a1a24;
            border-radius: 8px; 
            overflow: hidden; 
            height: 10px;
        }
        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--theme-secondary), var(--theme-primary));
            transition: width 0.8s ease-out;
            border-radius: 8px;
        }

        /* Timer FAB */
        .timer-fab {
            background: #111;
            border: 2px solid var(--theme-primary);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .timer-fab.active {
            border-color: var(--accent-red);
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 51, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
        }

        .ai-text-cursor::after {
            content: '|';
            animation: blink 1s step-end infinite;
            margin-left: 2px;
            color: var(--theme-primary);
        }
        @keyframes blink { 50% { opacity: 0; } }

        ::-webkit-scrollbar { width: 4px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }

        #toast-zone {
            position: fixed; top: calc(env(safe-area-inset-top, 0px) + 24px); left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; flex-direction: column; gap: 8px; width: 95%; max-width: 350px;
        }

        .high-priority-task {
            border-left: 4px solid var(--accent-red);
            background: linear-gradient(90deg, rgba(255,51,102,0.05) 0%, transparent 100%);
        }

        /* Clean Input */
        .clean-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 16px; /* Prevents iOS auto-zoom */
        }
        .clean-input:focus {
            border-color: var(--theme-primary);
            outline: none;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Mobile Adjustments */
        @media (max-width: 640px) {
            #mainUI, #mainFooter {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            .glass-panel {
                padding: 1rem;
            }
            #moduleSlots {
                top: 1rem;
                right: 1rem;
                gap: 0.5rem;
            }
            #moduleSlots > div {
                width: 1.5rem;
                height: 1.5rem;
            }
            #moduleSlots > div > i {
                font-size: 0.75rem;
            }
            #moduleSlots > div > span {
                font-size: 6px;
                padding: 0.125rem;
                top: -0.25rem;
                right: -0.25rem;
            }
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen pb-[env(safe-area-inset-bottom,6rem)]">

    <!-- 3D Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Notifications -->
    <div id="toast-zone"></div>

    <!-- Init Name Prompt Overlay -->
    <div id="namePromptModal" class="fixed inset-0 bg-black/90 z-[200] flex items-center justify-center hidden px-4">
        <div class="glass-panel p-6 sm:p-8 max-w-sm w-full text-center">
            <h2 class="text-2xl font-bold text-white mb-2">Welcome</h2>
            <p class="text-sm text-gray-400 mb-6">What is your name?</p>
            <input type="text" id="operatorNameInput" placeholder="Your Name..." class="w-full clean-input px-4 py-3 mb-6 rounded-lg text-center font-medium">
            <button onclick="saveName()" class="w-full bg-white text-black font-semibold py-3 rounded-lg hover:bg-gray-200 transition-colors">Get Started</button>
        </div>
    </div>

    <!-- Shop Modal Overlay -->
    <div id="shopModal" class="fixed inset-0 bg-black/80 z-[150] flex flex-col items-center justify-center hidden backdrop-blur-sm p-4">
        <div class="glass-panel w-full max-w-md p-6 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="ph-bold ph-shopping-cart text-[#fcee0a]"></i> Shop
                </h2>
                <button onclick="closeShop()" class="text-gray-400 hover:text-white p-2"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            <div id="shopItemsContainer" class="flex flex-col gap-3">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- Inventory Modal Overlay -->
    <div id="inventoryModal" class="fixed inset-0 bg-black/80 z-[150] flex flex-col items-center justify-center hidden backdrop-blur-sm p-4">
        <div class="glass-panel w-full max-w-md p-6 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="ph-bold ph-backpack text-[#bc13fe]"></i> Inventory
                </h2>
                <button onclick="closeInventory()" class="text-gray-400 hover:text-white p-2"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            <div id="inventoryItemsContainer" class="flex flex-col gap-3">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <div id="mainUI" class="w-full max-w-md px-4 mt-6 flex flex-col gap-5 hidden pb-24">
        
        <!-- Header / Stats -->
        <header class="glass-panel p-5 flex flex-col gap-5 relative">
            
            <!-- Module Slots (Top Right) -->
            <div class="absolute top-4 right-4 flex gap-2" id="moduleSlots">
                <!-- Slots generated via JS -->
            </div>

            <!-- Assistant Communicator -->
            <div class="flex items-start gap-3 border-b border-white/10 pb-4 pr-24">
                <div class="w-12 h-12 rounded-full border border-[var(--theme-primary)] bg-black/50 flex items-center justify-center shrink-0">
                    <i class="ph-fill ph-robot text-[var(--theme-primary)] text-2xl"></i>
                </div>
                <div class="flex flex-col justify-center min-h-[48px]">
                    <p class="text-xs font-bold text-[var(--theme-primary)]">Assistant</p>
                    <p id="aiMessage" class="text-sm text-gray-200 ai-text-cursor leading-tight mt-1">Hello! Getting things ready...</p>
                </div>
            </div>

            <!-- Metrics Grid -->
            <div class="grid grid-cols-3 gap-3 text-center">
                <div class="flex flex-col items-center justify-center bg-black/40 p-3 rounded-lg border border-gray-800">
                    <i class="ph-fill ph-coins text-yellow-400 text-xl mb-1"></i>
                    <span id="stat-coins" class="text-lg font-bold font-mono">0</span>
                    <span class="text-[10px] font-semibold text-gray-400 uppercase tracking-wide">Coins</span>
                </div>
                <div class="flex flex-col items-center justify-center bg-black/40 p-3 rounded-lg border border-gray-800">
                    <i class="ph-fill ph-fire text-orange-500 text-xl mb-1"></i>
                    <span id="stat-streak" class="text-lg font-bold font-mono">0</span>
                    <span class="text-[10px] font-semibold text-gray-400 uppercase tracking-wide">Days</span>
                </div>
                <div class="flex flex-col items-center justify-center bg-black/40 p-3 rounded-lg border border-gray-800">
                    <i class="ph-fill ph-lightning text-white text-xl mb-1"></i>
                    <span id="stat-tickets" class="text-lg font-bold font-mono">0</span>
                    <span class="text-[10px] font-semibold text-gray-400 uppercase tracking-wide">Boosts</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full">
                <div class="flex justify-between text-xs font-semibold text-gray-400 mb-2 px-1">
                    <span>Daily Progress</span>
                    <span id="xp-text" class="font-mono text-[var(--theme-primary)] font-bold">0%</span>
                </div>
                <div class="xp-bar-bg">
                    <div id="xp-bar" class="xp-bar-fill" style="width: 0%;"></div>
                </div>
            </div>

            <!-- Analytics Card -->
            <div class="w-full bg-black/40 border border-gray-800 rounded-lg p-3 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="ph-duotone ph-chart-line-up text-[var(--theme-secondary)] text-lg"></i>
                    <span class="text-xs font-semibold text-gray-400">Most Active Time:</span>
                </div>
                <span id="stat-peak" class="text-xs font-bold text-white">Need Data</span>
            </div>

        </header>

        <!-- Input Area -->
        <div class="flex items-center gap-2">
            <button id="priorityToggleBtn" onclick="togglePriority()" class="w-12 h-12 bg-black/50 border border-gray-700 hover:border-red-500 text-gray-500 rounded-lg flex items-center justify-center transition-colors btn-interact shrink-0">
                <i id="priorityIcon" class="ph-bold ph-warning text-xl"></i>
            </button>
            <div class="relative flex-1">
                <input type="text" id="taskInput" 
                       onkeydown="if(event.key==='Enter') addUserTask()"
                       oninput="checkCommands(this)"
                       placeholder="Add a new task..." 
                       class="w-full clean-input pl-4 pr-12 py-3 rounded-lg transition-all">
                <button onclick="addUserTask()" class="absolute right-1 top-1 bottom-1 w-10 bg-black/20 hover:bg-[var(--theme-primary)] text-[var(--theme-primary)] hover:text-black rounded-md flex items-center justify-center transition-colors btn-interact z-10">
                    <i class="ph-bold ph-plus text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Task List -->
        <div id="taskList" class="flex flex-col gap-3 min-h-[200px]">
            <!-- Tasks generated dynamically -->
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <footer id="mainFooter" class="fixed bottom-0 w-full max-w-md bg-[#0a0a0c]/95 backdrop-blur-lg border-t border-gray-800 px-6 py-4 flex justify-between items-center z-50 hidden">
        
        <div class="flex gap-6 z-10">
            <!-- Shop Action -->
            <button onclick="openShop()" class="flex flex-col items-center gap-1 btn-interact text-gray-400 hover:text-[#fcee0a] transition-colors group">
                <i class="ph-fill ph-shopping-cart text-2xl group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-semibold">Shop</span>
            </button>

            <!-- Inventory Action -->
            <button onclick="openInventory()" class="flex flex-col items-center gap-1 btn-interact text-gray-400 hover:text-[#bc13fe] transition-colors group relative">
                <i class="ph-fill ph-backpack text-2xl group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-semibold">Stash</span>
            </button>
        </div>

        <!-- Big Center Timer Button -->
        <div class="absolute left-1/2 transform -translate-x-1/2 -top-6 flex flex-col items-center z-20">
            <button id="timerBtn" onclick="toggleTimer()" class="w-16 h-16 timer-fab flex items-center justify-center text-white text-3xl btn-interact bg-black">
                <i id="timerIcon" class="ph-fill ph-play"></i>
            </button>
            <div class="bg-black/90 border border-gray-800 px-3 py-1 rounded-full mt-2 shadow-lg backdrop-blur-md">
                <span id="timerDisplay" class="text-xs font-mono font-bold text-[var(--theme-primary)]">00:00:00</span>
            </div>
        </div>

        <div class="flex gap-6 z-10">
            <!-- Boost Action -->
            <button onclick="useTicket()" class="flex flex-col items-center gap-1 btn-interact text-gray-400 hover:text-white transition-colors group">
                <i class="ph-fill ph-lightning text-2xl group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-semibold">Boost</span>
            </button>
        </div>
    </footer>

    <script>
        // --- 1. SMART ASSISTANT DIALOGUE SYSTEM ---
        const AI_BRAIN = {
            morning:[
                "Good morning! Ready to tackle the day?",
                "A fresh start! Remember to drink some water.",
                "What's on the agenda for today?"
            ],
            afternoon:[
                "Good afternoon! Keep up the great work.",
                "Stay focused, you're doing well.",
                "Hope your day is going smoothly!"
            ],
            evening:[
                "Good evening! Time to start wrapping things up.",
                "Great work today. You earned some rest.",
                "Take it easy tonight."
            ],
            night:[
                "It's getting quite late. Make sure to get some sleep!",
                "Don't push yourself too hard tonight.",
                "Time to rest and recharge for tomorrow."
            ],
            complete:[
                "Task completed! Coins earned.",
                "Great job! Keep it up.",
                "Done and dusted!"
            ],
            idle:[
                "Ready for your next task.",
                "What should we do next?",
                "Waiting for your input."
            ],
            levelUp:[
                "Level up! Fantastic work.",
                "Progress filled! Enjoy the bonus coins."
            ]
        };

        const SYSTEM_QUESTS =[
            { text: "Drink a glass of water", type: 'Health' },
            { text: "Tidy up your workspace", type: 'Home' },
            { text: "15 minutes of stretching", type: 'Health' },
            { text: "Read 10 pages of a book", type: 'Learning' },
            { text: "Clear your desk", type: 'Home' },
            { text: "Take 5 deep breaths", type: 'Wellness' },
            { text: "Freshen up / Wash face", type: 'Health' },
            { text: "Plan tasks for tomorrow", type: 'Planning' },
            { text: "Go for a short walk", type: 'Health' },
            { text: "Disconnect from screens for 1 hour", type: 'Wellness' }
        ];

        const SHOP_ITEMS =[
            { id: 'xp_overclocker', name: 'XP Booster', desc: 'Doubles Progress gain for 1 Hour', cost: 1000, duration: 1, type: 'buff', icon: 'ph-trend-up', color: 'text-blue-400' },
            { id: 'credit_siphon', name: 'Coin Multiplier', desc: 'Doubles Coin rewards for 1 Hour', cost: 1000, duration: 1, type: 'buff', icon: 'ph-coins', color: 'text-yellow-400' },
            { id: 'auto_repair', name: 'Task Skipper', desc: 'Instantly clears 1 Daily task', cost: 500, duration: 0, type: 'instant', icon: 'ph-magic-wand', color: 'text-purple-400' },
            { id: 'stability_patch', name: 'Streak Protector', desc: 'Protects Daily Streak for 24 hours', cost: 200, duration: 24, type: 'buff', icon: 'ph-shield-check', color: 'text-green-400' },
            { id: 'theme_matrix', name: 'Green Theme', desc: 'Unlocks Green UI Colorway', cost: 1500, duration: 0, type: 'permanent', theme: 'theme-matrix', icon: 'ph-paint-brush', color: 'text-green-500' },
            { id: 'theme_crimson', name: 'Red Theme', desc: 'Unlocks Red UI Colorway', cost: 1500, duration: 0, type: 'permanent', theme: 'theme-crimson', icon: 'ph-paint-brush', color: 'text-red-500' },
            { id: 'game_battery', name: 'Timer Extension', desc: 'Instantly adds 1 hour to Focus Timer', cost: 1000, duration: 0, type: 'instant', icon: 'ph-hourglass-high', color: 'text-blue-400' }
        ];

        let state = {
            userName: null,
            coins: 0,
            streak: 1,
            optimization: 0, // out of 5
            tickets: 0, // Boosts
            tasks:[],
            userRecurringTasks:[],
            isTimerActive: false,
            gameSeconds: 0,
            endTime: null,
            lastDate: null,
            activeModules:[],
            inventory: {},
            theme: 'default',
            taskHistory: [],
            unlockedThemes: ['default']
        };

        let isHighPriorityActive = false;
        let isTyping = false;

        const SOUNDS = {
            add: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'),
            complete: new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3'),
            coin: new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3'),
            error: new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3')
        };
        Object.values(SOUNDS).forEach(s => s.volume = 0.3);

        // --- 2. INITIALIZATION ---
        function loadState() {
            const data = localStorage.getItem('questify_nexus_data');
            if (data) {
                const parsed = JSON.parse(data);
                // Migrate from older version if needed (remove reboots)
                if(parsed.reboots !== undefined) delete parsed.reboots;
                
                state = { ...state, ...parsed };
                if(!state.unlockedThemes) state.unlockedThemes = ['default'];
                if(!state.activeModules) state.activeModules =[];
                if(!state.inventory) state.inventory = {};
                if(!state.taskHistory) state.taskHistory =[];
            }
            
            if (!state.userName) {
                document.getElementById('namePromptModal').classList.remove('hidden');
                document.getElementById('operatorNameInput').focus();
            } else {
                initApp();
            }
        }

        function saveName() {
            const val = document.getElementById('operatorNameInput').value.trim();
            if(val) {
                state.userName = val;
                document.getElementById('namePromptModal').classList.add('hidden');
                saveState();
                initApp();
            }
        }

        function initApp() {
            document.getElementById('mainUI').classList.remove('hidden');
            document.getElementById('mainFooter').classList.remove('hidden');
            
            applyTheme(state.theme);

            if("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
            
            checkDailyReset();
            updateUI();
            renderTasks();
            updateAnalytics();

            if(state.isTimerActive) {
                if(Date.now() >= state.endTime) {
                    state.isTimerActive = false;
                    state.gameSeconds = 0;
                } else {
                    document.getElementById('timerBtn').classList.add('active');
                    document.getElementById('timerIcon').className = "ph-fill ph-pause";
                }
            }
            renderModuleSlots();
            setInterval(renderModuleSlots, 60000);
        }

        // --- 3. DIALOGUE SYSTEM ---
        function aiSpeak(context) {
            if (isTyping) return;
            let pool = AI_BRAIN[context] || AI_BRAIN.idle;
            
            if (context === 'idle' || context === 'login') {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 12) pool = AI_BRAIN.morning;
                else if (hour >= 12 && hour < 18) pool = AI_BRAIN.afternoon;
                else if (hour >= 18 && hour < 22) pool = AI_BRAIN.evening;
                else pool = AI_BRAIN.night;
            }

            let msg = pool[Math.floor(Math.random() * pool.length)];
            if(context === 'login') msg = `Welcome back, ${state.userName}! ` + msg;

            const el = document.getElementById('aiMessage');
            el.innerHTML = '';
            let i = 0;
            isTyping = true;
            const typing = setInterval(() => {
                if(i < msg.length) {
                    el.innerHTML += msg.charAt(i);
                    i++;
                } else {
                    clearInterval(typing);
                    isTyping = false;
                }
            }, 25);
        }

        // --- 4. CORE MECHANICS ---
        function isModuleActive(id) {
            const now = Date.now();
            state.activeModules = state.activeModules.filter(m => m.expiresAt > now);
            return state.activeModules.some(m => m.id === id);
        }

        function checkDailyReset() {
            const today = new Date().toDateString();
            
            if (state.lastDate !== today) {
                const yesterday = new Date(Date.now() - 86400000).toDateString();
                if (state.lastDate === yesterday) {
                    state.streak++;
                } else if (state.lastDate) {
                    if (isModuleActive('stability_patch')) {
                        showToast("Streak protected by Streak Protector.", "ph-shield-check");
                    } else {
                        state.streak = 1;
                    }
                }

                generateNewDayRoutines();
                state.lastDate = today;
                aiSpeak('login');
                showToast("Tasks reset for the new day!", "ph-sun");
            } else {
                aiSpeak('idle');
            }
            saveState();
        }

        function generateNewDayRoutines() {
            state.tasks =[];
            const shuffled = [...SYSTEM_QUESTS].sort(() => 0.5 - Math.random());
            const selectedSystem = shuffled.slice(0, 4); // Just 4 daily tasks
            
            selectedSystem.forEach(q => createTaskObj(q.text, 'Daily', false, false));
            state.userRecurringTasks.forEach(text => createTaskObj(text, 'Personal', true, false));
        }

        function createTaskObj(text, category, isUserAdded, isPriority) {
            const baseReward = Math.floor(Math.random() * 200) + 100; // 100-300
            state.tasks.push({
                id: Date.now() + Math.random(),
                text: text,
                category: category,
                baseReward: baseReward,
                isUserAdded: isUserAdded,
                isPriority: isPriority
            });
        }

        function togglePriority() {
            isHighPriorityActive = !isHighPriorityActive;
            const btn = document.getElementById('priorityToggleBtn');
            const icon = document.getElementById('priorityIcon');
            if(isHighPriorityActive) {
                btn.classList.replace('text-gray-500', 'text-red-500');
                btn.classList.replace('border-gray-700', 'border-red-500');
                btn.classList.add('bg-red-500/10');
            } else {
                btn.classList.replace('text-red-500', 'text-gray-500');
                btn.classList.replace('border-red-500', 'border-gray-700');
                btn.classList.remove('bg-red-500/10');
            }
        }

        function addUserTask() {
            const input = document.getElementById('taskInput');
            const val = input.value.trim();
            if(!val) return;

            createTaskObj(val, 'Personal', true, isHighPriorityActive);
            
            if(!state.userRecurringTasks.includes(val)) {
                state.userRecurringTasks.push(val);
            }

            input.value = '';
            SOUNDS.add.play();
            renderTasks();
            saveState();
            aiSpeak('idle');
        }

        function removeTask(id) {
            const el = document.getElementById(`task-${id}`);
            if(el) {
                el.style.transform = "scale(0.95)";
                el.style.opacity = "0";
            }
            setTimeout(() => {
                state.tasks = state.tasks.filter(t => t.id !== id);
                renderTasks();
                saveState();
            }, 200);
        }

        function dropUserTaskForever(text, id) {
            state.userRecurringTasks = state.userRecurringTasks.filter(t => t !== text);
            removeTask(id);
        }

        function completeTask(id, reward, isPriority) {
            let finalReward = reward;
            if (isModuleActive('credit_siphon')) finalReward *= 2;
            if (isPriority) finalReward = Math.floor(finalReward * 1.5);

            const el = document.getElementById(`task-${id}`);
            if(el) {
                el.style.transform = "translateX(20px)";
                el.style.opacity = "0";
            }

            setTimeout(() => {
                state.tasks = state.tasks.filter(t => t.id !== id);
                state.coins += finalReward;
                
                let optiGain = isModuleActive('xp_overclocker') ? 2 : 1;
                state.optimization += optiGain;

                state.taskHistory.push(Date.now());

                if(state.optimization >= 5) {
                    state.optimization -= 5;
                    state.coins += 2000;
                    state.tickets++; // Bonus boost on level up
                    aiSpeak('levelUp');
                    SOUNDS.complete.play();
                    confetti({ particleCount: 150, spread: 80, origin: {y: 0.6} });
                    showToast("Level Up! Progress filled. +2000 Coins", "ph-star");
                } else {
                    aiSpeak('complete');
                    SOUNDS.coin.play();
                }

                updateUI();
                renderTasks();
                updateAnalytics();
                saveState();
            }, 200);
        }

        // --- 5. UI RENDERING ---
        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';

            if(state.tasks.length === 0) {
                list.innerHTML = `
                    <div class="glass-panel p-8 text-center border border-dashed border-gray-700">
                        <i class="ph-duotone ph-check-circle text-4xl text-[var(--theme-primary)] mb-3 opacity-80"></i>
                        <p class="font-semibold text-gray-200 text-lg">All tasks complete!</p>
                        <p class="text-xs text-gray-500 mt-1">Add some tasks above or enjoy your free time.</p>
                    </div>`;
                return;
            }

            state.tasks.forEach(task => {
                const icon = task.category === 'Daily' ? 'ph-sun' : 'ph-user';
                let calcReward = task.baseReward;
                if (isModuleActive('credit_siphon')) calcReward *= 2;
                if (task.isPriority) calcReward = Math.floor(calcReward * 1.5);

                const priorityClass = task.isPriority ? 'high-priority-task' : 'border-l-[3px] border-[var(--theme-primary)]';

                const div = document.createElement('div');
                div.id = `task-${task.id}`;
                div.className = `glass-panel p-3 sm:p-4 flex items-center gap-3 transition-all duration-300 relative overflow-hidden ${priorityClass}`;
                
                div.innerHTML = `
                    <div class="w-10 h-10 bg-black/40 rounded-lg flex items-center justify-center shrink-0">
                        <i class="ph-fill ${icon} text-xl ${task.isPriority ? 'text-red-400' : 'text-gray-300'}"></i>
                    </div>
                    <div class="flex-1 min-w-0 pr-2">
                        <div class="flex items-center gap-2 mb-0.5">
                            <span class="text-[10px] font-semibold uppercase text-gray-400">${task.category} ${task.isPriority ? '<span class="text-red-400">• High Priority</span>' : ''}</span>
                            ${task.isUserAdded ? `<button onclick="dropUserTaskForever('${task.text.replace(/'/g, "\\'")}', ${task.id})" class="text-[10px] text-red-400 hover:text-red-300 uppercase"><i class="ph-bold ph-trash"></i> Drop</button>` : ''}
                        </div>
                        <p class="font-medium text-gray-100 text-sm sm:text-base leading-snug">${task.text}</p>
                        <p class="text-[10px] font-mono text-yellow-400 font-semibold mt-1">+${calcReward} Coins</p>
                    </div>
                    <button onclick="completeTask(${task.id}, ${task.baseReward}, ${task.isPriority})" class="w-12 h-12 bg-black/30 border border-gray-700 hover:border-[var(--theme-primary)] hover:text-[var(--theme-primary)] text-gray-400 rounded-lg flex items-center justify-center transition-colors btn-interact shrink-0">
                        <i class="ph-bold ph-check text-2xl"></i>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function renderModuleSlots() {
            const container = document.getElementById('moduleSlots');
            container.innerHTML = '';
            
            for(let i=0; i<3; i++) {
                const mod = state.activeModules[i];
                const div = document.createElement('div');
                if (mod) {
                    const item = SHOP_ITEMS.find(x => x.id === mod.id);
                    const remaining = Math.max(0, mod.expiresAt - Date.now());
                    const timeDisplay = remaining < 3600000 ? Math.ceil(remaining / 60000) + 'm' : Math.ceil(remaining / 3600000) + 'h';
                    div.className = `w-8 h-8 bg-black/60 border border-[var(--theme-primary)] rounded-md flex items-center justify-center relative group shadow-[0_0_8px_rgba(0,243,255,0.2)]`;
                    div.innerHTML = `
                        <i class="ph-fill ${item.icon} text-[var(--theme-primary)] text-sm"></i>
                        <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[8px] px-1 rounded-full font-bold">${timeDisplay}</span>
                        <div class="absolute -bottom-8 right-0 bg-black border border-gray-700 text-white text-[10px] px-2 py-1 rounded hidden group-hover:block whitespace-nowrap z-50">
                            ${item.name}
                        </div>
                    `;
                } else {
                    div.className = `w-8 h-8 bg-black/30 border border-gray-800 border-dashed rounded-md flex items-center justify-center`;
                }
                container.appendChild(div);
            }
        }

        function updateUI() {
            document.getElementById('stat-coins').innerText = state.coins.toLocaleString();
            document.getElementById('stat-streak').innerText = state.streak;
            document.getElementById('stat-tickets').innerText = state.tickets;

            const pct = Math.min(100, (state.optimization / 5) * 100);
            document.getElementById('xp-text').innerText = `${pct}%`;
            document.getElementById('xp-bar').style.width = `${pct}%`;
        }

        function updateAnalytics() {
            if(state.taskHistory.length === 0) {
                document.getElementById('stat-peak').innerText = 'Need Data';
                return;
            }
            let hours = state.taskHistory.map(t => new Date(t).getHours());
            let hourCounts = hours.reduce((acc, h) => { acc[h] = (acc[h] || 0) + 1; return acc; }, {});
            let peakHour = parseInt(Object.keys(hourCounts).reduce((a, b) => hourCounts[a] > hourCounts[b] ? a : b));
            
            let timeOfDay = 'NIGHT';
            if(peakHour >= 5 && peakHour < 12) timeOfDay = 'MORNING';
            else if(peakHour >= 12 && peakHour < 18) timeOfDay = 'AFTERNOON';
            else if(peakHour >= 18 && peakHour < 22) timeOfDay = 'EVENING';

            document.getElementById('stat-peak').innerText = timeOfDay;
        }

        function showToast(msg, icon = "ph-info") {
            const zone = document.getElementById('toast-zone');
            const el = document.createElement('div');
            el.className = 'glass-panel px-4 py-3 flex items-center gap-3 transition-all border border-[var(--theme-primary)]/50';
            el.innerHTML = `<i class="ph-fill ${icon} text-[var(--theme-primary)] text-xl"></i> <span class="text-sm font-medium text-white">${msg}</span>`;
            
            el.style.animation = 'slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
            zone.appendChild(el);

            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-20px)';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        // --- 6. SHOP & INVENTORY ---
        function openShop() {
            const c = document.getElementById('shopItemsContainer');
            c.innerHTML = '';
            
            SHOP_ITEMS.forEach(item => {
                let actionText = `${item.cost} Coins`;
                let isOwned = false;

                if (item.type === 'permanent') {
                    if (state.unlockedThemes.includes(item.theme)) {
                        actionText = 'Equipped';
                        isOwned = true;
                    }
                }

                const btnHtml = (item.type === 'permanent' && isOwned && state.theme === item.theme) 
                    ? `<button disabled class="px-3 py-1.5 bg-gray-800 text-gray-400 text-xs font-semibold rounded-lg border border-gray-700">Equipped</button>`
                    : `<button onclick="buyItem('${item.id}')" class="px-3 py-1.5 bg-black text-[#fcee0a] hover:bg-[#fcee0a] hover:text-black text-xs font-semibold rounded-lg border border-[#fcee0a] transition-colors btn-interact">${actionText}</button>`;

                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 bg-black/40 border border-gray-800 rounded-xl hover:border-gray-600 transition-colors";
                div.innerHTML = `
                    <div class="flex items-center gap-3 pr-2">
                        <div class="w-10 h-10 rounded-lg border border-gray-700 bg-black/50 flex items-center justify-center shrink-0">
                            <i class="ph-fill ${item.icon} text-2xl ${item.color}"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-gray-100">${item.name}</span>
                            <span class="text-[10px] text-gray-400 mt-0.5 leading-tight">${item.desc}</span>
                        </div>
                    </div>
                    ${btnHtml}
                `;
                c.appendChild(div);
            });
            document.getElementById('shopModal').classList.remove('hidden');
        }

        function closeShop() {
            document.getElementById('shopModal').classList.add('hidden');
        }

        function buyItem(id) {
            const item = SHOP_ITEMS.find(x => x.id === id);
            
            if (item.type === 'permanent') {
                if(state.unlockedThemes.includes(item.theme)) {
                    applyTheme(item.theme);
                    showToast("Theme Applied.", "ph-check");
                    openShop();
                    return;
                }
            }

            if(state.coins >= item.cost) {
                state.coins -= item.cost;
                SOUNDS.coin.play();

                if (item.type === 'buff') {
                    state.inventory[id] = (state.inventory[id] || 0) + 1;
                    showToast(`Acquired: ${item.name}. Added to Inventory.`, "ph-backpack");
                } 
                else if (item.type === 'instant') {
                    if(item.id === 'auto_repair') {
                        const target = state.tasks.find(t => t.category === 'Daily');
                        if(target) {
                            removeTask(target.id);
                            showToast("Task Skipper: Task cleared.", "ph-magic-wand");
                        } else {
                            state.coins += item.cost;
                            showToast("No Daily tasks to clear. Refunded.", "ph-warning-circle");
                        }
                    } else if (item.id === 'game_battery') {
                        state.gameSeconds += 3600; 
                        if(state.isTimerActive) state.endTime += 3600000;
                        showToast("Timer Extension Applied. +1 Hour.", "ph-hourglass-high");
                    }
                } 
                else if (item.type === 'permanent') {
                    state.unlockedThemes.push(item.theme);
                    applyTheme(item.theme);
                    showToast("New Theme Unlocked.", "ph-paint-brush");
                }

                updateUI(); saveState(); openShop();
            } else {
                SOUNDS.error.play();
                showToast("Not enough Coins.", "ph-warning");
            }
        }

        function openInventory() {
            const c = document.getElementById('inventoryItemsContainer');
            c.innerHTML = '';
            
            const itemKeys = Object.keys(state.inventory);
            let hasItems = false;

            itemKeys.forEach(id => {
                const count = state.inventory[id];
                if (count > 0) {
                    hasItems = true;
                    const item = SHOP_ITEMS.find(x => x.id === id);
                    const isActive = isModuleActive(id);
                    const btnText = isActive ? 'Active' : 'Use';
                    const btnClass = isActive ? 'bg-gray-800 text-gray-400 border-gray-700' : 'bg-black text-[#bc13fe] hover:bg-[#bc13fe] hover:text-black border-[#bc13fe] btn-interact';
                    const onclick = isActive ? '' : `onclick="activateItem('${item.id}')"`;

                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-3 bg-black/40 border border-gray-800 rounded-xl hover:border-gray-600 transition-colors";
                    div.innerHTML = `
                        <div class="flex items-center gap-3 pr-2">
                            <div class="w-10 h-10 rounded-lg border border-gray-700 bg-black/50 flex items-center justify-center shrink-0 relative">
                                <i class="ph-fill ${item.icon} text-2xl ${item.color}"></i>
                                <span class="absolute -top-1.5 -right-1.5 bg-[#bc13fe] text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">${count}</span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-sm font-bold text-gray-100">${item.name}</span>
                                <span class="text-[10px] text-gray-400 mt-0.5 leading-tight">${item.desc}</span>
                            </div>
                        </div>
                        <button ${onclick} ${isActive ? 'disabled' : ''} class="px-4 py-1.5 text-xs font-semibold rounded-lg border transition-colors ${btnClass}">${btnText}</button>
                    `;
                    c.appendChild(div);
                }
            });

            if (!hasItems) {
                c.innerHTML = `<p class="text-center text-gray-500 text-sm py-8 border border-dashed border-gray-800 rounded-xl">Inventory Empty</p>`;
            }

            document.getElementById('inventoryModal').classList.remove('hidden');
        }

        function closeInventory() {
            document.getElementById('inventoryModal').classList.add('hidden');
        }

        function activateItem(id) {
            if (!state.inventory[id] || state.inventory[id] <= 0) return;
            const item = SHOP_ITEMS.find(x => x.id === id);
            
            if (isModuleActive(id)) {
                showToast("Boost is already active.", "ph-warning");
                return;
            }

            state.inventory[id]--;
            if(state.inventory[id] === 0) delete state.inventory[id];

            if(state.activeModules.length >= 3) {
                state.activeModules.shift(); 
            }
            const expiresAt = Date.now() + (item.duration * 3600000);
            state.activeModules.push({ id, expiresAt });

            SOUNDS.add.play();
            showToast(`Activated: ${item.name}`, "ph-lightning");
            
            renderModuleSlots();
            updateUI();
            saveState();
            openInventory(); 
        }

        function applyTheme(themeClass) {
            state.theme = themeClass;
            document.body.className = `flex flex-col items-center min-h-screen pb-[env(safe-area-inset-bottom,6rem)] ${themeClass === 'default' ? '' : themeClass}`;
            saveState();
        }

        // --- 7. TIMER PROTOCOL ---
        function useTicket() {
            if(state.tickets > 0) {
                state.tickets--;
                state.gameSeconds += 3600; 
                if(state.isTimerActive) state.endTime += 3600000;
                SOUNDS.add.play();
                showToast("Boost Used: +1 Hour focus time.", "ph-lightning");
                updateUI(); saveState();
            } else {
                SOUNDS.error.play();
                showToast("No Boosts Available. Level up to earn more!", "ph-warning-circle");
            }
        }

        function toggleTimer() {
            const btn = document.getElementById('timerBtn');
            const icon = document.getElementById('timerIcon');

            if (!state.isTimerActive) {
                if (state.gameSeconds <= 0) {
                    SOUNDS.error.play();
                    showToast("No focus time left. Get a Timer Extension or use a Boost.", "ph-clock");
                    return;
                }
                state.isTimerActive = true;
                state.endTime = Date.now() + (state.gameSeconds * 1000);
                btn.classList.add('active');
                icon.className = "ph-fill ph-pause";
                showToast("Focus Timer Started.", "ph-play");
            } else {
                state.isTimerActive = false;
                state.gameSeconds = Math.max(0, Math.floor((state.endTime - Date.now()) / 1000));
                state.endTime = null;
                btn.classList.remove('active');
                icon.className = "ph-fill ph-play";
                showToast("Timer Paused.", "ph-pause");
            }
            saveState();
        }

        setInterval(() => {
            let secs = state.gameSeconds;
            if (state.isTimerActive && state.endTime) {
                secs = Math.max(0, Math.floor((state.endTime - Date.now()) / 1000));
                if (secs <= 0) {
                    state.isTimerActive = false;
                    state.gameSeconds = 0;
                    document.getElementById('timerBtn').classList.remove('active');
                    document.getElementById('timerIcon').className = "ph-fill ph-play";
                    showToast("Timer Finished.", "ph-check-circle");
                    if("Notification" in window && Notification.permission === "granted") {
                        new Notification("Questify Assistant", { body: "Focus Session Over. Great job!" });
                    }
                }
            }
            
            const h = Math.floor(secs / 3600).toString().padStart(2, '0');
            const m = Math.floor((secs % 3600) / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${h}:${m}:${s}`;
        }, 1000);

        // --- 8. DATA MGMT & RESET ---
        function saveState() {
            localStorage.setItem('questify_nexus_data', JSON.stringify(state));
        }

        function checkCommands(input) {
            if(input.value.trim().toLowerCase() === 'reset') {
                input.value = '';
                showToast("Resetting all data...", "ph-warning");
                setTimeout(systemPurge, 1500);
            }
        }

        function systemPurge() {
            localStorage.clear();
            location.reload();
        }

        // --- 9. 3D BACKGROUND (Ambient Floating Particles) ---
        const isMobile = window.innerWidth < 768 || /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true, antialias: !isMobile });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1 : 2));

        const particles = new THREE.BufferGeometry();
        const count = isMobile ? 250 : 800;
        const posArray = new Float32Array(count * 3);
        for(let i=0; i < count*3; i++) {
            posArray[i] = (Math.random() - 0.5) * 15;
        }
        particles.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const material = new THREE.PointsMaterial({ size: 0.02, color: 0x00f3ff, transparent: true, opacity: 0.4 });
        const particleMesh = new THREE.Points(particles, material);
        scene.add(particleMesh);
        camera.position.z = 3;

        function animateBg() {
            requestAnimationFrame(animateBg);
            
            if(state.theme === 'theme-matrix') material.color.setHex(0x00ff41);
            else if(state.theme === 'theme-crimson') material.color.setHex(0xff003c);
            else material.color.setHex(0x00f3ff);

            if(state.isTimerActive) {
                // Slightly faster calm floating
                particleMesh.rotation.y += 0.002;
                particleMesh.rotation.x += 0.001;
            } else {
                // Calm floating
                particleMesh.rotation.y += 0.0005;
                particleMesh.rotation.x += 0.0003;
            }
            
            renderer.render(scene, camera);
        }
        animateBg();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const style = document.createElement('style');
        style.innerHTML = `@keyframes slideDown { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }`;
        document.head.appendChild(style);

        window.onload = loadState;
    </script>
</body>
</html>
