<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Questify // Nexus Cyberpunk</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            /* Cyberpunk Palette */
            --bg-base: #050507;
            --bg-surface: rgba(20, 20, 25, 0.85);
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-yellow: #fcee0a;
            --neon-red: #ff003c;
            --text-main: #ffffff;
            --text-muted: #888888;
            --theme-primary: var(--neon-blue);
            --theme-secondary: var(--neon-purple);
        }

        /* Themes */
        body.theme-matrix {
            --theme-primary: #00ff41;
            --theme-secondary: #008f11;
            --neon-blue: #00ff41;
            --neon-purple: #008f11;
        }
        body.theme-crimson {
            --theme-primary: #ff003c;
            --theme-secondary: #8b0000;
            --neon-blue: #ff003c;
            --neon-purple: #8b0000;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; z-index: -1; width: 100vw; height: 100vh;
        }

        .glass-panel {
            background: var(--bg-surface);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 3px solid var(--theme-primary);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px; /* Sharper edges for cyberpunk */
        }

        /* Animated Interactive Buttons */
        .btn-interact {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slow-float 4s ease-in-out infinite;
            min-height: 44px; /* Touch-friendly */
            min-width: 44px;
        }
        .btn-interact:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 0 15px var(--theme-primary);
            animation: none;
            border-color: var(--theme-primary);
        }
        .btn-interact:active {
            transform: scale(0.95);
        }

        @keyframes slow-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .xp-bar-bg {
            background: #111;
            border: 1px solid #333;
            border-radius: 2px; overflow: hidden; height: 8px;
        }
        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--theme-secondary), var(--theme-primary));
            box-shadow: 0 0 10px var(--theme-primary);
            transition: width 0.8s ease-out;
        }

        /* Timer FAB */
        .timer-fab {
            background: #111;
            border: 2px solid var(--theme-primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            border-radius: 8px;
        }
        .timer-fab.active {
            border-color: var(--neon-red);
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.6);
            animation: pulse-ring 1s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(255, 0, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 60, 0); }
        }

        .ai-text-cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        ::-webkit-scrollbar { width: 4px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--theme-primary); }

        #toast-zone {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; flex-direction: column; gap: 8px; width: 90%; max-width: 400px;
        }

        /* Glitch Effects */
        .glitch-anim {
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }
        @keyframes glitch-skew {
            0% { transform: translate(0) }
            20% { transform: translate(-4px, 4px) }
            40% { transform: translate(-4px, -4px) }
            60% { transform: translate(4px, 4px) }
            80% { transform: translate(4px, -4px) }
            100% { transform: translate(0) }
        }

        .high-priority-task {
            border-left: 4px solid var(--neon-red);
            box-shadow: inset 0 0 20px rgba(255,0,60,0.1), 0 0 10px rgba(255,0,60,0.3);
        }

        /* Cyberpunk Input */
        .cyber-input {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--theme-secondary);
            color: var(--neon-blue);
            font-family: 'JetBrains Mono', monospace;
        }
        .cyber-input:focus {
            box-shadow: 0 0 10px var(--theme-primary);
            outline: none;
        }

        /* Mobile Optimizations */
        @media (max-width: 640px) {
            .glass-panel {
                padding: 0.75rem;
                margin: 0 0.5rem;
            }
            .btn-interact {
                min-height: 48px;
                min-width: 48px;
            }
            #mainUI {
                padding: 0 1rem;
            }
            #mainFooter {
                padding: 0 1rem;
            }
            .timer-fab {
                width: 20px;
                height: 20px;
            }
            .xp-bar-bg {
                height: 6px;
            }
            .ai-text-cursor {
                font-size: 0.875rem;
            }
            #toast-zone {
                width: 95%;
                max-width: none;
            }
        }

    </style>
</head>
<body class="flex flex-col items-center min-h-screen pb-32">

    <!-- 3D Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Notifications -->
    <div id="toast-zone"></div>

    <!-- Init Name Prompt Overlay -->
    <div id="namePromptModal" class="fixed inset-0 bg-black/90 z-[200] flex items-center justify-center hidden">
        <div class="glass-panel p-8 max-w-sm w-full text-center border-l-4 border-neon-blue">
            <h2 class="text-2xl font-bold text-white mb-2 tracking-widest uppercase">System Init</h2>
            <p class="text-sm text-gray-400 mb-6 font-mono">Enter Operator Designation</p>
            <input type="text" id="operatorNameInput" placeholder="> DESIGNATION..." class="w-full cyber-input px-4 py-3 mb-6 rounded text-center text-lg uppercase tracking-widest">
            <button onclick="saveName()" class="w-full bg-neon-blue text-black font-bold py-3 uppercase tracking-widest hover:bg-white transition-colors">Initialize</button>
        </div>
    </div>

    <!-- Shop Modal Overlay -->
    <div id="shopModal" class="fixed inset-0 bg-black/80 z-[150] flex flex-col items-center justify-center hidden backdrop-blur-sm p-4">
        <div class="glass-panel w-full max-w-md p-6 max-h-[80vh] overflow-y-auto border-l-4 border-neon-yellow">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-neon-yellow tracking-widest uppercase flex items-center gap-2">
                    <i class="ph-bold ph-shopping-cart"></i> Black Market
                </h2>
                <button onclick="closeShop()" class="text-gray-400 hover:text-white"><i class="ph-bold ph-x text-2xl"></i></button>
            </div>
            <div id="shopItemsContainer" class="flex flex-col gap-4">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- Inventory (Stash) Modal Overlay -->
    <div id="inventoryModal" class="fixed inset-0 bg-black/80 z-[150] flex flex-col items-center justify-center hidden backdrop-blur-sm p-4">
        <div class="glass-panel w-full max-w-md p-6 max-h-[80vh] overflow-y-auto border-l-4 border-neon-purple">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-neon-purple tracking-widest uppercase flex items-center gap-2">
                    <i class="ph-bold ph-backpack"></i> System Stash
                </h2>
                <button onclick="closeInventory()" class="text-gray-400 hover:text-white"><i class="ph-bold ph-x text-2xl"></i></button>
            </div>
            <div id="inventoryItemsContainer" class="flex flex-col gap-4">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <div id="mainUI" class="w-full max-w-md px-4 mt-6 flex flex-col gap-5 hidden">
        
        <!-- Header / Stats -->
        <header class="glass-panel p-5 flex flex-col gap-4 relative">
            
            <!-- Module Slots (Top Right) -->
            <div class="absolute top-4 right-4 flex gap-2" id="moduleSlots">
                <!-- Slots generated via JS -->
            </div>

            <!-- AI Communicator -->
            <div class="flex items-start gap-3 border-b border-white/10 pb-4 pr-24">
                <div class="w-12 h-12 rounded border border-neon-blue bg-black flex items-center justify-center shrink-0 shadow-[0_0_10px_var(--neon-blue)]">
                    <i class="ph-fill ph-cpu text-neon-blue text-2xl"></i>
                </div>
                <div class="flex flex-col justify-center min-h-[48px]">
                    <div class="flex items-center gap-2">
                        <p class="text-[10px] font-bold text-neon-blue tracking-wider uppercase font-mono">Nexus AI</p>
                        <p id="aiStatus" class="text-[9px] text-neon-purple font-mono border border-neon-purple px-1 rounded-sm">[STATUS: ANALYZING]</p>
                    </div>
                    <p id="aiMessage" class="text-sm font-medium text-slate-200 ai-text-cursor leading-tight mt-1">Initializing...</p>
                </div>
            </div>

            <!-- Metrics Grid -->
            <div class="grid grid-cols-4 gap-2 text-center">
                <div class="flex flex-col items-center justify-center bg-black/50 p-2 rounded border border-gray-800">
                    <i class="ph-fill ph-currency-btc text-neon-yellow text-xl mb-1 drop-shadow-[0_0_5px_rgba(252,238,10,0.8)]"></i>
                    <span id="stat-coins" class="text-lg font-bold font-mono">0</span>
                    <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wide">Credits</span>
                </div>
                <div class="flex flex-col items-center justify-center bg-black/50 p-2 rounded border border-gray-800">
                    <i class="ph-fill ph-fire text-neon-red text-xl mb-1 drop-shadow-[0_0_5px_rgba(255,0,60,0.8)]"></i>
                    <span id="stat-streak" class="text-lg font-bold font-mono">0</span>
                    <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wide">Streak</span>
                </div>
                <div class="flex flex-col items-center justify-center bg-black/50 p-2 rounded border border-gray-800">
                    <i class="ph-fill ph-key text-white text-xl mb-1 drop-shadow-[0_0_5px_rgba(255,255,255,0.8)]"></i>
                    <span id="stat-tickets" class="text-lg font-bold font-mono">0</span>
                    <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wide">Passes</span>
                </div>
                <div class="flex flex-col items-center justify-center bg-black/50 p-2 rounded border border-gray-800">
                    <i class="ph-fill ph-arrows-clockwise text-neon-blue text-xl mb-1 drop-shadow-[0_0_5px_rgba(0,243,255,0.8)]"></i>
                    <span id="stat-reboots" class="text-lg font-bold font-mono">0</span>
                    <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wide">Reboots</span>
                </div>
            </div>

            <!-- Optimization Progression -->
            <div class="w-full mt-1">
                <div class="flex justify-between text-[10px] font-bold text-gray-400 mb-1.5 px-1 uppercase tracking-wider">
                    <span>System Optimization</span>
                    <span id="xp-text" class="font-mono text-neon-blue">0%</span>
                </div>
                <div class="xp-bar-bg">
                    <div id="xp-bar" class="xp-bar-fill" style="width: 0%;"></div>
                </div>
            </div>

            <!-- Efficiency Analytics Card -->
            <div class="w-full bg-black/60 border border-gray-800 rounded p-2 flex justify-between items-center px-4 mt-2">
                <div class="flex items-center gap-2">
                    <i class="ph-duotone ph-chart-line-up text-neon-purple text-lg"></i>
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Peak Efficiency:</span>
                </div>
                <span id="stat-peak" class="text-sm font-mono font-bold text-white">ANALYZING...</span>
            </div>

        </header>

        <!-- Input Area -->
        <div class="relative flex items-center gap-2">
            <button id="priorityToggleBtn" onclick="togglePriority()" class="w-12 h-12 bg-black border border-gray-700 hover:border-neon-red text-gray-500 rounded flex items-center justify-center shadow-md transition-colors btn-interact shrink-0">
                <i id="priorityIcon" class="ph-bold ph-warning text-xl"></i>
            </button>
            <div class="relative flex-1">
                <input type="text" id="taskInput" 
                       onkeydown="if(event.key==='Enter') addUserTask()"
                       oninput="checkCommands(this)"
                       placeholder="Define objective... (or type 'reset')" 
                       class="w-full cyber-input pl-4 pr-12 py-3 rounded text-white placeholder-gray-500 font-medium text-sm transition-all shadow-lg uppercase">
                <button onclick="addUserTask()" class="absolute right-1 top-1 w-10 h-10 bg-black/50 hover:bg-theme-primary text-theme-primary hover:text-black border border-theme-primary rounded flex items-center justify-center transition-all z-10 btn-interact">
                    <i class="ph-bold ph-plus text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Task List -->
        <div id="taskList" class="flex flex-col gap-3 min-h-[200px]">
            <!-- Tasks generated dynamically -->
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <footer id="mainFooter" class="fixed bottom-0 w-full max-w-md bg-[#050507]/95 backdrop-blur-xl border-t border-gray-800 px-6 pb-6 pt-3 flex justify-between items-center z-50 hidden relative">
        
        <div class="flex gap-4 z-10">
            <!-- Shop Action -->
            <button onclick="openShop()" class="flex flex-col items-center gap-1 btn-interact opacity-80 hover:opacity-100 text-gray-400 w-12 group">
                <div class="w-10 h-10 bg-black rounded border border-gray-800 group-hover:border-neon-yellow flex items-center justify-center text-neon-yellow transition-colors">
                    <i class="ph-fill ph-shopping-cart text-xl"></i>
                </div>
                <span class="text-[9px] font-bold uppercase tracking-widest mt-1">Market</span>
            </button>

            <!-- Inventory Action -->
            <button onclick="openInventory()" class="flex flex-col items-center gap-1 btn-interact opacity-80 hover:opacity-100 text-gray-400 w-12 group relative">
                <div class="w-10 h-10 bg-black rounded border border-gray-800 group-hover:border-neon-purple flex items-center justify-center text-neon-purple transition-colors">
                    <i class="ph-fill ph-backpack text-xl"></i>
                </div>
                <span class="text-[9px] font-bold uppercase tracking-widest mt-1">Stash</span>
            </button>
        </div>

        <!-- Big Center Timer Button -->
        <div class="absolute left-1/2 transform -translate-x-1/2 -top-8 flex flex-col items-center z-20">
            <button id="timerBtn" onclick="toggleTimer()" class="w-16 h-16 timer-fab flex items-center justify-center text-white text-2xl btn-interact z-10">
                <i id="timerIcon" class="ph-fill ph-power"></i>
            </button>
            <div class="bg-black border border-gray-800 px-3 py-1 rounded mt-2 shadow-[0_0_10px_rgba(0,0,0,0.8)]">
                <span id="timerDisplay" class="text-xs font-mono font-bold text-neon-blue tracking-widest">00:00:00</span>
            </div>
        </div>

        <div class="flex gap-4 z-10">
            <!-- Boost Action -->
            <button onclick="useTicket()" class="flex flex-col items-center gap-1 btn-interact opacity-80 hover:opacity-100 text-gray-400 w-12 group">
                <div class="w-10 h-10 bg-black rounded border border-gray-800 group-hover:border-white flex items-center justify-center text-white transition-colors">
                    <i class="ph-fill ph-lightning text-xl"></i>
                </div>
                <span class="text-[9px] font-bold uppercase tracking-widest mt-1">Boost</span>
            </button>
        </div>
    </footer>

    <script>
        // --- 1. SMART AI DIALOGUE SYSTEM ---
        const AI_BRAIN = {
            morning:[
                "Operator online. Systems primed for early execution.",
                "Morning cycle detected. Hydration protocols recommended.",
                "Awaiting daily directives. Let's optimize."
            ],
            afternoon:[
                "Mid-cycle update. Efficiency remains stable.",
                "Maintain focus vectors. Distractions are liabilities.",
                "System temperatures optimal. Continue execution."
            ],
            evening:[
                "Twilight cycle. Wrap up primary objectives.",
                "Outstanding metrics today. Prepare for cooldown.",
                "Data structures compiling. Excellent work."
            ],
            night:[
                "Warning: Late hour detected. Sleep overrides suggested.",
                "Cognitive overclocking not recommended at this hour.",
                "System entering low-power mode soon."
            ],
            complete:[
                "Objective neutralized. Credits transferred.",
                "Task deleted from matrix. Efficiency logged.",
                "System parameters improved."
            ],
            idle:[
                "Awaiting next input.",
                "System standby. Define objective.",
                "Matrix stable. Ready for commands."
            ],
            levelUp:[
                "SYSTEM REBOOT COMPLETE. Limits surpassed.",
                "Optimization 100%. Major credit payload delivered."
            ]
        };

        const SYSTEM_QUESTS =[
            { text: "Drink 500ml H2O", type: 'Biometrics' },
            { text: "Organize physical sector", type: 'Maintenance' },
            { text: "15 mins physical calibration", type: 'Biometrics' },
            { text: "Consume 10 pages of data", type: 'Cognitive' },
            { text: "Clear workspace debris", type: 'Maintenance' },
            { text: "5 mins deep oxygen intake", type: 'Cognitive' },
            { text: "Execute hygiene protocols", type: 'Maintenance' },
            { text: "Review daily directives", type: 'Cognitive' },
            { text: "Stretch chassis / back", type: 'Biometrics' },
            { text: "Disconnect from network for 1 hour", type: 'Focus' }
        ];

        const SHOP_ITEMS =[
            { id: 'xp_overclocker', name: 'XP Overclocker', desc: 'Increases System Optimization gain by 2x (1 Hr)', cost: 2000, duration: 1, type: 'buff', icon: 'ph-trend-up', color: 'text-neon-blue' },
            { id: 'credit_siphon', name: 'Credit Siphon', desc: 'Increases Credit rewards by 2x (1 Hr)', cost: 2500, duration: 1, type: 'buff', icon: 'ph-currency-btc', color: 'text-neon-yellow' },
            { id: 'auto_repair', name: 'Auto-Repair Bot', desc: 'Instantly clears 1 System task', cost: 1000, duration: 0, type: 'instant', icon: 'ph-robot', color: 'text-gray-300' },
            { id: 'stability_patch', name: 'Stability Patch', desc: 'Protects Daily Streak for 24 hours', cost: 1500, duration: 24, type: 'buff', icon: 'ph-shield-check', color: 'text-neon-purple' },
            { id: 'theme_matrix', name: 'Matrix UI Theme', desc: 'Unlocks Green/Matrix Colorway', cost: 5000, duration: 0, type: 'permanent', theme: 'theme-matrix', icon: 'ph-paint-brush', color: 'text-green-500' },
            { id: 'theme_crimson', name: 'Crimson UI Theme', desc: 'Unlocks Red Alert Colorway', cost: 5000, duration: 0, type: 'permanent', theme: 'theme-crimson', icon: 'ph-paint-brush', color: 'text-red-500' },
            { id: 'game_battery', name: 'Game Battery', desc: 'Instantly adds 1 hour to Timer', cost: 3000, duration: 0, type: 'instant', icon: 'ph-game-controller', color: 'text-neon-blue' }
        ];

        let state = {
            userName: null,
            coins: 0,
            streak: 1,
            reboots: 0, 
            optimization: 0, // out of 5
            tickets: 0, // Kept as Passes/Boosts
            tasks:[],
            userRecurringTasks:[],
            isTimerActive: false,
            gameSeconds: 0,
            endTime: null,
            lastDate: null,
            activeModules:[],
            inventory: {},
            theme: 'default',
            taskHistory: [],
            unlockedThemes: ['default']
        };

        let isHighPriorityActive = false;
        let isTyping = false;

        const SOUNDS = {
            add: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'),
            complete: new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3'),
            coin: new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3'),
            error: new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3')
        };
        Object.values(SOUNDS).forEach(s => s.volume = 0.4);

        // --- 2. INITIALIZATION ---
        function loadState() {
            const data = localStorage.getItem('questify_nexus_data');
            if (data) {
                state = { ...state, ...JSON.parse(data) };
                if(!state.unlockedThemes) state.unlockedThemes = ['default'];
                if(!state.activeModules) state.activeModules =[];
                if(!state.inventory) state.inventory = {};
                if(!state.taskHistory) state.taskHistory =[];
            }
            
            if (!state.userName) {
                document.getElementById('namePromptModal').classList.remove('hidden');
                document.getElementById('operatorNameInput').focus();
            } else {
                initApp();
            }
        }

        function saveName() {
            const val = document.getElementById('operatorNameInput').value.trim();
            if(val) {
                state.userName = val;
                document.getElementById('namePromptModal').classList.add('hidden');
                saveState();
                initApp();
            }
        }

        function initApp() {
            document.getElementById('mainUI').classList.remove('hidden');
            document.getElementById('mainFooter').classList.remove('hidden');
            
            applyTheme(state.theme);

            if("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
            
            // Register service worker for offline support
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').then(reg => console.log('SW registered')).catch(err => console.log('SW failed', err));
            }
            
            checkDailyReset();
            updateUI();
            renderTasks();
            updateAnalytics();

            if(state.isTimerActive) {
                if(Date.now() >= state.endTime) {
                    state.isTimerActive = false;
                    state.gameSeconds = 0;
                } else {
                    document.getElementById('timerBtn').classList.add('active');
                    document.getElementById('timerIcon').className = "ph-fill ph-pause";
                }
            }
            setInterval(updateAiStatus, 60000);
            updateAiStatus();
            renderModuleSlots();
        }

        // --- 3. AI & SYSTEM DIALOGUE ---
        function updateAiStatus() {
            const el = document.getElementById('aiStatus');
            const h = new Date().getHours();
            if (h >= 23 || h < 5) {
                el.innerText = "[STATUS: SLEEP_MODE]";
                el.className = "text-[9px] text-gray-500 font-mono border border-gray-500 px-1 rounded-sm";
            } else if (state.isTimerActive) {
                el.innerText = "[STATUS: OVERCLOCKED]";
                el.className = "text-[9px] text-neon-red font-mono border border-neon-red px-1 rounded-sm";
            } else {
                el.innerText = "[STATUS: ANALYZING]";
                el.className = "text-[9px] text-neon-purple font-mono border border-neon-purple px-1 rounded-sm";
            }
        }

        function aiSpeak(context) {
            if (isTyping) return;
            let pool = AI_BRAIN[context] || AI_BRAIN.idle;
            
            if (context === 'idle' || context === 'login') {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 12) pool = AI_BRAIN.morning;
                else if (hour >= 12 && hour < 18) pool = AI_BRAIN.afternoon;
                else if (hour >= 18 && hour < 22) pool = AI_BRAIN.evening;
                else pool = AI_BRAIN.night;
            }

            let msg = pool[Math.floor(Math.random() * pool.length)];
            if(context === 'login') msg = `Operator ${state.userName} verified. ` + msg;

            const el = document.getElementById('aiMessage');
            el.innerHTML = '';
            let i = 0;
            isTyping = true;
            const typing = setInterval(() => {
                if(i < msg.length) {
                    el.innerHTML += msg.charAt(i);
                    i++;
                } else {
                    clearInterval(typing);
                    isTyping = false;
                }
            }, 30);
        }

        // --- 4. CORE MECHANICS ---
        function isModuleActive(id) {
            // Clean up expired modules silently
            const now = Date.now();
            state.activeModules = state.activeModules.filter(m => m.expiresAt > now);
            return state.activeModules.some(m => m.id === id);
        }

        function checkDailyReset() {
            const today = new Date().toDateString();
            
            if (state.lastDate !== today) {
                const yesterday = new Date(Date.now() - 86400000).toDateString();
                if (state.lastDate === yesterday) {
                    state.streak++;
                } else if (state.lastDate) {
                    if (isModuleActive('stability_patch')) {
                        showToast("Streak protected by Stability Patch.", "ph-shield-check");
                    } else {
                        state.streak = 1;
                    }
                }

                generateNewDayRoutines();
                state.lastDate = today;
                aiSpeak('login');
                showToast("System directives reset for new cycle.", "ph-sun");
            } else {
                aiSpeak('idle');
            }
            saveState();
        }

        function generateNewDayRoutines() {
            state.tasks =[];
            const shuffled = [...SYSTEM_QUESTS].sort(() => 0.5 - Math.random());
            const selectedSystem = shuffled.slice(0, 5);
            
            selectedSystem.forEach(q => createTaskObj(q.text, 'System', false, false));
            state.userRecurringTasks.forEach(text => createTaskObj(text, 'Personal', true, false));
        }

        function createTaskObj(text, category, isUserAdded, isPriority) {
            const baseReward = Math.floor(Math.random() * 300) + 200; // 200-500
            state.tasks.push({
                id: Date.now() + Math.random(),
                text: text,
                category: category,
                baseReward: baseReward,
                isUserAdded: isUserAdded,
                isPriority: isPriority
            });
        }

        function togglePriority() {
            isHighPriorityActive = !isHighPriorityActive;
            const btn = document.getElementById('priorityToggleBtn');
            const icon = document.getElementById('priorityIcon');
            if(isHighPriorityActive) {
                btn.classList.replace('text-gray-500', 'text-neon-red');
                btn.classList.replace('border-gray-700', 'border-neon-red');
                btn.classList.add('shadow-[0_0_15px_rgba(255,0,60,0.5)]');
                icon.className = "ph-fill ph-warning";
            } else {
                btn.classList.replace('text-neon-red', 'text-gray-500');
                btn.classList.replace('border-neon-red', 'border-gray-700');
                btn.classList.remove('shadow-[0_0_15px_rgba(255,0,60,0.5)]');
                icon.className = "ph-bold ph-warning";
            }
        }

        function addUserTask() {
            const input = document.getElementById('taskInput');
            const val = input.value.trim();
            if(!val) return;

            createTaskObj(val, 'Personal', true, isHighPriorityActive);
            
            if(!state.userRecurringTasks.includes(val)) {
                state.userRecurringTasks.push(val);
            }

            input.value = '';
            SOUNDS.add.play();
            renderTasks();
            saveState();
            aiSpeak('idle');
        }

        function removeTask(id, isGlitch = false) {
            const el = document.getElementById(`task-${id}`);
            if(el) {
                if(isGlitch) el.classList.add('glitch-anim');
                el.style.transform = "scale(0.95)";
                el.style.opacity = "0";
            }
            setTimeout(() => {
                state.tasks = state.tasks.filter(t => t.id !== id);
                renderTasks();
                saveState();
            }, 300);
        }

        function dropUserTaskForever(text, id) {
            state.userRecurringTasks = state.userRecurringTasks.filter(t => t !== text);
            removeTask(id, true);
        }

        function completeTask(id, reward, isPriority) {
            let finalReward = reward;
            if (isModuleActive('credit_siphon')) finalReward *= 2;
            if (isPriority) finalReward = Math.floor(finalReward * 1.5);

            const el = document.getElementById(`task-${id}`);
            if(el) {
                el.style.transform = "scale(0.95)";
                el.style.opacity = "0";
            }

            setTimeout(() => {
                state.tasks = state.tasks.filter(t => t.id !== id);
                state.coins += finalReward;
                
                let optiGain = isModuleActive('xp_overclocker') ? 2 : 1;
                state.optimization += optiGain;

                state.taskHistory.push(Date.now());

                if(state.optimization >= 5) {
                    state.optimization -= 5;
                    state.reboots++;
                    state.coins += 2000;
                    state.tickets++; // Bonus pass on reboot
                    aiSpeak('levelUp');
                    SOUNDS.complete.play();
                    confetti({ particleCount: 200, spread: 100, colors:['#00f3ff', '#bc13fe', '#fcee0a'] });
                    showToast("SYSTEM REBOOT: Optimization 100%. +2000 CR", "ph-arrows-clockwise");
                } else {
                    aiSpeak('complete');
                    SOUNDS.coin.play();
                }

                updateUI();
                renderTasks();
                updateAnalytics();
                saveState();
            }, 250);
        }

        // --- 5. UI RENDERING ---
        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';

            if(state.tasks.length === 0) {
                list.innerHTML = `
                    <div class="glass-panel p-8 rounded-xl text-center border-dashed border border-gray-700">
                        <i class="ph-duotone ph-check-square-offset text-4xl text-neon-blue mb-3 opacity-80"></i>
                        <p class="font-bold text-gray-300 tracking-widest uppercase text-sm">Matrix Clear</p>
                        <p class="text-[10px] text-gray-500 mt-1 font-mono">Standby for new objectives.</p>
                    </div>`;
                return;
            }

            state.tasks.forEach(task => {
                const icon = task.category === 'System' ? 'ph-cpu' : 'ph-user';
                let calcReward = task.baseReward;
                if (isModuleActive('credit_siphon')) calcReward *= 2;
                if (task.isPriority) calcReward = Math.floor(calcReward * 1.5);

                const priorityClass = task.isPriority ? 'high-priority-task' : 'border-l-2 border-theme-primary';

                const div = document.createElement('div');
                div.id = `task-${task.id}`;
                div.className = `glass-panel p-4 flex items-center gap-4 transition-all duration-300 relative overflow-hidden ${priorityClass}`;
                
                div.innerHTML = `
                    <div class="w-10 h-10 bg-black border border-gray-800 rounded flex items-center justify-center shrink-0">
                        <i class="ph-fill ${icon} text-xl ${task.isPriority ? 'text-neon-red' : 'text-neon-blue'}"></i>
                    </div>
                    <div class="flex-1 min-w-0 pr-2">
                        <div class="flex items-center gap-2 mb-0.5">
                            <span class="text-[9px] font-bold uppercase tracking-widest text-gray-500 font-mono">${task.category} ${task.isPriority ? '<span class="text-neon-red">• HIGH PRIORITY</span>' : ''}</span>
                            ${task.isUserAdded ? `<button onclick="dropUserTaskForever('${task.text.replace(/'/g, "\\'")}', ${task.id})" class="text-[9px] text-red-500 hover:text-red-400 uppercase tracking-widest font-mono"><i class="ph-bold ph-trash"></i> Drop</button>` : ''}
                        </div>
                        <p class="font-semibold text-gray-100 text-sm truncate uppercase tracking-wider">${task.text}</p>
                        <p class="text-[10px] font-mono text-neon-yellow font-bold mt-1">+${calcReward} CR</p>
                    </div>
                    <button onclick="completeTask(${task.id}, ${task.baseReward}, ${task.isPriority})" class="w-12 h-12 bg-black border border-gray-700 hover:border-theme-primary hover:text-theme-primary text-gray-500 rounded flex items-center justify-center transition-all btn-interact shrink-0 group">
                        <i class="ph-bold ph-check text-xl group-hover:drop-shadow-[0_0_8px_var(--theme-primary)]"></i>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function renderModuleSlots() {
            const container = document.getElementById('moduleSlots');
            container.innerHTML = '';
            
            // Allow up to 3 slots
            for(let i=0; i<3; i++) {
                const mod = state.activeModules[i];
                const div = document.createElement('div');
                if (mod) {
                    const item = SHOP_ITEMS.find(x => x.id === mod.id);
                    div.className = `w-8 h-8 bg-black border border-neon-blue rounded flex flex-col items-center justify-center relative group shadow-[0_0_8px_rgba(0,243,255,0.3)]`;
                    div.innerHTML = `
                        <i class="ph-fill ${item.icon} text-neon-blue text-sm"></i>
                        <!-- Tooltip -->
                        <div class="absolute -bottom-8 right-0 bg-black border border-gray-700 text-white text-[9px] font-mono px-2 py-1 rounded hidden group-hover:block whitespace-nowrap z-50">
                            ${item.name} active
                        </div>
                    `;
                } else {
                    div.className = `w-8 h-8 bg-black/50 border border-gray-800 border-dashed rounded flex items-center justify-center`;
                    div.innerHTML = `<span class="text-[8px] text-gray-600 font-mono">SLOT</span>`;
                }
                container.appendChild(div);
            }
        }

        function updateUI() {
            document.getElementById('stat-coins').innerText = state.coins.toLocaleString();
            document.getElementById('stat-streak').innerText = state.streak;
            document.getElementById('stat-tickets').innerText = state.tickets;
            document.getElementById('stat-reboots').innerText = state.reboots;

            const pct = Math.min(100, (state.optimization / 5) * 100);
            document.getElementById('xp-text').innerText = `${pct}%`;
            document.getElementById('xp-bar').style.width = `${pct}%`;
        }

        function updateAnalytics() {
            if(state.taskHistory.length === 0) {
                document.getElementById('stat-peak').innerText = 'NO DATA';
                return;
            }
            // Calculate most active hour segment
            let hours = state.taskHistory.map(t => new Date(t).getHours());
            let hourCounts = hours.reduce((acc, h) => { acc[h] = (acc[h] || 0) + 1; return acc; }, {});
            let peakHour = parseInt(Object.keys(hourCounts).reduce((a, b) => hourCounts[a] > hourCounts[b] ? a : b));
            
            let timeOfDay = 'NIGHT CYCLE';
            if(peakHour >= 5 && peakHour < 12) timeOfDay = 'MORNING CYCLE';
            else if(peakHour >= 12 && peakHour < 18) timeOfDay = 'MID-DAY CYCLE';
            else if(peakHour >= 18 && peakHour < 22) timeOfDay = 'EVE CYCLE';

            document.getElementById('stat-peak').innerText = timeOfDay;
        }

        function showToast(msg, icon = "ph-info") {
            const zone = document.getElementById('toast-zone');
            const el = document.createElement('div');
            el.className = 'glass-panel bg-black/95 border border-neon-blue px-4 py-3 flex items-center gap-3 shadow-[0_0_20px_rgba(0,243,255,0.3)] transition-all';
            el.innerHTML = `<i class="ph-fill ${icon} text-neon-blue text-xl"></i> <span class="text-xs font-bold text-white tracking-widest uppercase">${msg}</span>`;
            
            el.style.animation = 'slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
            zone.appendChild(el);

            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-20px)';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        // --- 6. SHOP & INVENTORY MODES ---
        function openShop() {
            const c = document.getElementById('shopItemsContainer');
            c.innerHTML = '';
            
            SHOP_ITEMS.forEach(item => {
                let actionText = `${item.cost} CR`;
                let isOwned = false;

                if (item.type === 'permanent') {
                    if (state.unlockedThemes.includes(item.theme)) {
                        actionText = 'EQUIPPED';
                        isOwned = true;
                    }
                }

                const btnHtml = (item.type === 'permanent' && isOwned && state.theme === item.theme) 
                    ? `<button disabled class="px-3 py-1 bg-gray-800 text-gray-500 text-xs font-bold font-mono rounded border border-gray-700 uppercase">EQUIPPED</button>`
                    : `<button onclick="buyItem('${item.id}')" class="px-3 py-1 bg-black text-neon-yellow hover:bg-neon-yellow hover:text-black text-xs font-bold font-mono rounded border border-neon-yellow transition-colors uppercase btn-interact">${actionText}</button>`;

                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 bg-black/50 border border-gray-800 rounded hover:border-gray-600 transition-colors";
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded border border-gray-700 bg-black flex items-center justify-center shrink-0">
                            <i class="ph-fill ${item.icon} text-2xl ${item.color}"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-white tracking-wider uppercase">${item.name}</span>
                            <span class="text-[10px] text-gray-400 font-mono">${item.desc}</span>
                        </div>
                    </div>
                    ${btnHtml}
                `;
                c.appendChild(div);
            });
            document.getElementById('shopModal').classList.remove('hidden');
        }

        function closeShop() {
            document.getElementById('shopModal').classList.add('hidden');
        }

        function buyItem(id) {
            const item = SHOP_ITEMS.find(x => x.id === id);
            
            if (item.type === 'permanent') {
                if(state.unlockedThemes.includes(item.theme)) {
                    applyTheme(item.theme);
                    showToast("Theme Overwritten.", "ph-check");
                    openShop();
                    return;
                }
            }

            if(state.coins >= item.cost) {
                state.coins -= item.cost;
                SOUNDS.coin.play();

                if (item.type === 'buff') {
                    state.inventory[id] = (state.inventory[id] || 0) + 1;
                    showToast(`Acquired: ${item.name}. Added to Stash.`, "ph-backpack");
                } 
                else if (item.type === 'instant') {
                    if(item.id === 'auto_repair') {
                        const target = state.tasks.find(t => t.category === 'System');
                        if(target) {
                            removeTask(target.id);
                            showToast("Auto-Repair: Clutter cleared.", "ph-robot");
                        } else {
                            // refund
                            state.coins += item.cost;
                            showToast("No System tasks to clear. Refunded.", "ph-warning-circle");
                        }
                    } else if (item.id === 'game_battery') {
                        state.gameSeconds += 3600; // 1 hour
                        if(state.isTimerActive) state.endTime += 3600000;
                        showToast("Game Battery Applied. +1 Hour.", "ph-game-controller");
                    }
                } 
                else if (item.type === 'permanent') {
                    state.unlockedThemes.push(item.theme);
                    applyTheme(item.theme);
                    showToast("New Matrix Interface Unlocked.", "ph-paint-brush");
                }

                updateUI(); saveState(); openShop();
            } else {
                SOUNDS.error.play();
                showToast("Insufficient Credits.", "ph-warning");
            }
        }

        function openInventory() {
            const c = document.getElementById('inventoryItemsContainer');
            c.innerHTML = '';
            
            const itemKeys = Object.keys(state.inventory);
            let hasItems = false;

            itemKeys.forEach(id => {
                const count = state.inventory[id];
                if (count > 0) {
                    hasItems = true;
                    const item = SHOP_ITEMS.find(x => x.id === id);
                    const isActive = isModuleActive(id);
                    const btnText = isActive ? 'ACTIVE' : 'ACTIVATE';
                    const btnClass = isActive ? 'bg-gray-800 text-gray-500 border-gray-700' : 'bg-black text-neon-purple hover:bg-neon-purple hover:text-black border-neon-purple btn-interact';
                    const onclick = isActive ? '' : `onclick="activateItem('${item.id}')"`;

                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-3 bg-black/50 border border-gray-800 rounded hover:border-gray-600 transition-colors";
                    div.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded border border-gray-700 bg-black flex items-center justify-center shrink-0 relative">
                                <i class="ph-fill ${item.icon} text-2xl ${item.color}"></i>
                                <span class="absolute -top-2 -right-2 bg-neon-purple text-black text-[10px] font-bold px-1.5 py-0.5 rounded-full">${count}</span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-sm font-bold text-white tracking-wider uppercase">${item.name}</span>
                                <span class="text-[10px] text-gray-400 font-mono">${item.desc}</span>
                            </div>
                        </div>
                        <button ${onclick} ${isActive ? 'disabled' : ''} class="px-3 py-1 text-xs font-bold font-mono rounded border transition-colors uppercase ${btnClass}">${btnText}</button>
                    `;
                    c.appendChild(div);
                }
            });

            if (!hasItems) {
                c.innerHTML = `<p class="text-center text-gray-500 font-mono text-sm py-8 uppercase tracking-widest border border-dashed border-gray-800 rounded">Stash Empty</p>`;
            }

            document.getElementById('inventoryModal').classList.remove('hidden');
        }

        function closeInventory() {
            document.getElementById('inventoryModal').classList.add('hidden');
        }

        function activateItem(id) {
            if (!state.inventory[id] || state.inventory[id] <= 0) return;
            const item = SHOP_ITEMS.find(x => x.id === id);
            
            if (isModuleActive(id)) {
                showToast("Module is already active.", "ph-warning");
                return;
            }

            // Remove from inventory
            state.inventory[id]--;
            if(state.inventory[id] === 0) delete state.inventory[id];

            // Add to active modules
            if(state.activeModules.length >= 3) {
                state.activeModules.shift(); // remove oldest
            }
            const expiresAt = Date.now() + (item.duration * 3600000);
            state.activeModules.push({ id, expiresAt });

            SOUNDS.add.play();
            showToast(`Activated: ${item.name}`, "ph-cpu");
            
            renderModuleSlots();
            updateUI();
            saveState();
            openInventory(); // Refresh view
        }

        function applyTheme(themeClass) {
            state.theme = themeClass;
            document.body.className = `flex flex-col items-center min-h-screen pb-32 ${themeClass === 'default' ? '' : themeClass}`;
            saveState();
        }

        // --- 7. TIMER PROTOCOL ---
        function useTicket() {
            if(state.tickets > 0) {
                state.tickets--;
                state.gameSeconds += 3600; 
                if(state.isTimerActive) state.endTime += 3600000;
                SOUNDS.add.play();
                showToast("Boost Key Used: +1 Hour focus time.", "ph-lightning");
                updateUI(); saveState();
            } else {
                SOUNDS.error.play();
                showToast("No Boost Keys Available.", "ph-warning-circle");
            }
        }

        function toggleTimer() {
            const btn = document.getElementById('timerBtn');
            const icon = document.getElementById('timerIcon');

            if (!state.isTimerActive) {
                if (state.gameSeconds <= 0) {
                    SOUNDS.error.play();
                    showToast("Zero focus energy. Acquire a Battery or Boost.", "ph-clock");
                    return;
                }
                state.isTimerActive = true;
                state.endTime = Date.now() + (state.gameSeconds * 1000);
                btn.classList.add('active');
                icon.className = "ph-fill ph-pause";
                showToast("Overclock Focus Engaged.", "ph-play");
            } else {
                state.isTimerActive = false;
                state.gameSeconds = Math.max(0, Math.floor((state.endTime - Date.now()) / 1000));
                state.endTime = null;
                btn.classList.remove('active');
                icon.className = "ph-fill ph-power";
                showToast("Overclock Paused.", "ph-pause");
            }
            updateAiStatus();
            saveState();
        }

        setInterval(() => {
            let secs = state.gameSeconds;
            if (state.isTimerActive && state.endTime) {
                secs = Math.max(0, Math.floor((state.endTime - Date.now()) / 1000));
                if (secs <= 0) {
                    state.isTimerActive = false;
                    state.gameSeconds = 0;
                    document.getElementById('timerBtn').classList.remove('active');
                    document.getElementById('timerIcon').className = "ph-fill ph-power";
                    showToast("Focus Cycle Complete.", "ph-check-circle");
                    updateAiStatus();
                    if("Notification" in window && Notification.permission === "granted") {
                        new Notification("Nexus AI", { body: "Focus Session Over. System normal." });
                    }
                }
            }
            
            const h = Math.floor(secs / 3600).toString().padStart(2, '0');
            const m = Math.floor((secs % 3600) / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${h}:${m}:${s}`;
        }, 1000);

        // --- 8. DATA MGMT & RESET PROTOCOL ---
        function saveState() {
            localStorage.setItem('questify_nexus_data', JSON.stringify(state));
        }

        function checkCommands(input) {
            if(input.value.trim().toLowerCase() === 'reset') {
                input.value = '';
                document.body.classList.add('glitch-anim');
                showToast("CRITICAL WARNING: RESET PROTOCOL INITIATED.", "ph-warning");
                setTimeout(systemPurge, 1500);
            }
        }

        function systemPurge() {
            localStorage.clear();
            location.reload();
        }

        // --- 9. 3D BACKGROUND (AMBIENT HYPERSPACE) ---
        const isMobile = window.innerWidth < 768 || /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true, antialias: !isMobile });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1 : 2));

        const particles = new THREE.BufferGeometry();
        const count = isMobile ? 300 : 1000;
        const posArray = new Float32Array(count * 3);
        for(let i=0; i < count*3; i++) {
            posArray[i] = (Math.random() - 0.5) * 15;
        }
        particles.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const material = new THREE.PointsMaterial({ size: 0.02, color: 0x00f3ff, transparent: true, opacity: 0.5 });
        const particleMesh = new THREE.Points(particles, material);
        scene.add(particleMesh);
        camera.position.z = 3;

        function animateBg() {
            requestAnimationFrame(animateBg);
            
            // Dynamic color based on theme
            if(state.theme === 'theme-matrix') material.color.setHex(0x00ff41);
            else if(state.theme === 'theme-crimson') material.color.setHex(0xff003c);
            else material.color.setHex(0x00f3ff);

            if(state.isTimerActive) {
                // Overclock Warp
                particleMesh.rotation.z += 0.005;
                particleMesh.position.z += 0.05;
                if(particleMesh.position.z > 5) particleMesh.position.z = 0;
            } else {
                // Standard Drift
                particleMesh.rotation.y += 0.001;
                particleMesh.rotation.x += 0.0005;
                particleMesh.position.z = 0;
            }
            
            renderer.render(scene, camera);
        }
        animateBg();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const style = document.createElement('style');
        style.innerHTML = `@keyframes slideDown { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }`;
        document.head.appendChild(style);

        window.onload = loadState;
    </script>
</body>
</html>
